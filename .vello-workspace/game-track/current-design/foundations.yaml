schema_version: 2
document_type: foundations
scope_id: game
items:
  CORE-001:
    kind: goal
    scope: project
    parent_refs: []
    statement: "플레이어는 화살촉 진행선의 차단 관계를 판단해 이동 가능한 화살을 추출하고 보드의 모든 화살을 제거하여 스테이지를 완료한다."
  GAME-GENERATION-INVARIANT-001:
    kind: principle
    scope: project
    parent_refs: [CORE-001]
    statement: "모든 생성 맵은 자원 한도, 셀 비겹침, 완전한 풀이와 무교착 조건을 만족해야 한다."
  GAME-DATA-INVARIANT-001:
    kind: principle
    scope: project
    parent_refs: [CORE-001]
    statement: "게임 런타임은 원격 원본에 직접 접근하지 않고 검증되어 버전 관리되는 로컬 밸런스 스냅샷을 사용한다."
