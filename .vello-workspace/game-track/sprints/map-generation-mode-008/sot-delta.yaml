      adopt_fixed: "표시된 candidate seed를 운영자가 Sheets seed 열에 반영한 뒤 검증·sync한다."
      regenerate_random: "새 runtime seed에서 closest-valid 후보 탐색을 다시 실행한다."
    status: user_accepted
    verification_mode: user_check
