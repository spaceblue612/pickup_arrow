  - id: SOT-008-BALANCE-SHEET-SCHEMA-V2
    target: sections.balance.authoring.workflow
    operation: replace
    content:
      canonical_source: "Google Sheets의 stage_profiles 탭"
      schema_version: 2
      tabs:
        _meta:
          columns: [key, value, description]
          edit_policy: warning_protected
        stage_profiles:
          columns: [stage_id, stage_order, expected_difficulty_level, grid_width, grid_height, seed, generation_mode, primary_arrow_count, min_length, max_length, target_empty_ratio, filler_max_length, min_dependency_depth, max_dependency_depth, min_initial_extractable_ratio, max_initial_extractable_ratio, min_forced_state_ratio, max_forced_state_ratio, max_candidate_attempts, operator_note]
          data_start_row: 2
          edit_policy: "헤더는 보호 경고, 운영 데이터는 편집 가능"
        metric_guide:
          columns: [metric_id, classification, group, value_type, required, allowed_range, default_value, stage_profiles_column, description]
          classifications: [configurable, observed, deferred]
          description_language: ko
          edit_policy: warning_protected
      migration: "v1의 기존 profile은 generation_mode=fixed로 채우고 initial content에 random STAGE-004를 추가한 뒤 v2로 검증·게시한다."
      row_policy: "완전한 빈 행만 무시하고 부분 행·수식·임의 표준 열·중복 stage_id 또는 stage_order·지원하지 않는 generation_mode는 전체 게시를 거절한다."
      stage_registry: "유효한 stage profile은 stage_order 순서로 등록하고 generation_mode에 따라 고정 또는 플레이별 생성한다."
      operator_flow:
        - "Apps Script 구조 마이그레이션으로 v2 열과 초기 random STAGE-004를 적용한다."
        - "stage_profiles를 편집하고 데이터 검증으로 마지막 정상 JSON 게시본을 갱신한다."
        - "로컬 Sync & Preview로 재검증·snapshot 교체·스테이지 미리보기를 수행한다."
        - "검토한 data/stage_balance.json을 포함해 게임을 다시 빌드·배포한다."
      runtime_policy: "게임 런타임은 원격 시트나 웹 앱에 접속하지 않고 버전 관리된 로컬 snapshot만 읽는다."
      exclusions: [manual_csv_import, runtime_direct_google_access, preview_writeback_to_sheet, authored_fixed_arrow_layout]
    status: verified
    verification_mode: independent_qa
    evidence: [05-implementation-handoff.md, 06-qa-handoff.md]
    replaces: []
    closeout_disposition: apply
  - id: SOT-008-STAGE-CATALOG-MODE-CONTRACT
    target: sections.systems.SYS-STAGE-CATALOG.balance_profile
    operation: replace
    content:
      source: "SYS-BALANCE-SYNC가 생성한 data/stage_balance.json"
      key: stage_id
      loading: "schema_version 2, content_hash와 전체 profile을 검증하고 stage_order 순서의 immutable index를 구성한다."
      fields: [stage_order, expected_difficulty_level, grid_size, seed, generation_mode, primary_arrow_count, min_length, max_length, target_empty_ratio, filler_max_length, dependency_target, max_candidate_attempts]
      seed_policy: "fixed는 profile seed를 그대로 사용하고 random은 생성 controller가 제공한 runtime seed를 사용한다."
      composition: "같은 stage_id의 별도 보드 콘텐츠가 있으면 결합하고 없으면 전체 직사각 보드로 생성한다."
      error_policy: "snapshot 누락·버전 불일치·잘못된 profile 또는 mode는 하드코딩 기본값으로 대체하지 않는다."
    status: verified
    verification_mode: independent_qa
    evidence: [05-implementation-handoff.md, 06-qa-handoff.md]
    replaces: []
    closeout_disposition: apply
  - id: SOT-008-MAP-GENERATION-CONTROLLER
    target: sections.systems.SYS-MAP-GENERATION-CONTROLLER
    operation: add
    content:
      responsibility: "stage profile의 generation_mode에 따라 결정적 또는 플레이별 seed로 비동기 맵 생성을 실행하고 진행·완료·실패·시간초과를 관리한다."
      input: [stage_id, generation_mode, base_seed, generation_profile, request_id]
      output: [progress, runtime_seed, stage_definition, failure, timeout]
      timeout_seconds: 10
      concurrency: "한 번에 하나의 활성 요청만 보드에 적용하며 취소·교체된 request_id의 결과는 폐기한다."
    status: verified
    verification_mode: independent_qa
    evidence: [05-implementation-handoff.md, 06-qa-handoff.md]
    replaces: []
    closeout_disposition: apply
