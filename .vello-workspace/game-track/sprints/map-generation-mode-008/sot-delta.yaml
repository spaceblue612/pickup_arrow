updates:
  - id: SOT-008-MAP-GENERATION-MODE-RULE
    target: sections.generation.map_modes
    operation: add
    content:
      profile_field: generation_mode
      values: [fixed, random]
      fixed: "시트에 저장된 base seed로 결정적으로 생성하며 새 플레이에서도 동일한 맵을 제공한다."
      random: "새 플레이 진입마다 snapshot을 수정하지 않는 새 runtime seed로 생성한다."
      new_play_boundary: "게임 진행 진입, 홈에서 재시도, 미리보기의 random Regenerate를 각각 새 플레이로 본다."
      validity: "두 모드 모두 기존 해결 가능성, 난이도 목표와 보드 자원 한도를 동일하게 적용한다."
    status: superseded
    verification_mode: independent_qa
    evidence: [05-implementation-handoff.md, 06-qa-handoff.md]
    replaces: []
    closeout_disposition: discard
  - id: SOT-008-MAP-GENERATION-FLOW
    target: sections.gameplay.map_generation_flow
    operation: add
    content:
      states: [home, generating, playing, generation_error]
      loading: "random 맵 생성 중 입력을 잠그고 경과 시간을 나타내는 0~10초 게이지와 생성 중 상태를 표시한다."
      timeout_seconds: 10
      failure: "생성 실패나 제한시간 도달 시 부분 결과를 폐기하고 홈에 문제 메시지와 실패 스테이지 재시도를 표시한다."
      retry: "재시도는 실패한 random 스테이지에 새 runtime seed로 진입한다."
      late_result_policy: "취소되거나 만료된 생성 요청의 늦은 결과는 보드 상태에 적용하지 않는다."
    status: user_accepted
    verification_mode: user_check
    evidence: [05-implementation-handoff.md, status-log.md]
    replaces: []
    closeout_disposition: apply
