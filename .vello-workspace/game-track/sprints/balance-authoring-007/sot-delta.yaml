sprint_id: balance-authoring-007
base_sot_ref: ../../current-design/current-design.yaml
updated_at: 2026-08-03
updates:
  - id: SOT-007-BALANCE-METRIC-CATALOG
    target: sections.balance.authoring.metric_catalog
    operation: add
    content:
      expected_level:
        field: expected_difficulty_level
        type: int
        range: [1, 100]
        required: false
        blank_policy: "미보정으로 표시하고 생성 조건에는 사용하지 않는다."
        role: "운영자가 지정하는 기대 난이도 표식이며 단일 자동 난이도 점수로 사용하지 않는다."
      configurable:
        identity:
          stage_id: {type: string, required: true, unique: true}
          stage_order: {type: int, required: true, unique: true, minimum: 1}
          operator_note: {type: string, required: false, runtime_ignored: true}
        board:
          grid_width: {type: int, range: [1, 999]}
          grid_height: {type: int, range: [1, 999]}
          cell_count_limit: 10000
        generation:
          seed: {type: int, range: [0, 2147483647]}
          primary_arrow_count: {type: int, minimum: 1, maximum: playable_cell_count}
          min_length: {type: int, minimum: 1, maximum: playable_cell_count}
          max_length: {type: int, minimum: min_length, maximum: playable_cell_count}
          target_empty_ratio: {type: float, range: [0.0, 1.0]}
          filler_max_length: {type: int, minimum: 1, maximum: playable_cell_count}
        dependency:
          dependency_depth: {type: int_range, minimum: 1, ordered: true}
          initial_extractable_ratio: {type: float_range, range: [0.0, 1.0], ordered: true}
          forced_state_ratio: {type: float_range, range: [0.0, 1.0], ordered: true}
        generation_budget:
          max_candidate_attempts: {type: int, range: [1, 256], default: 64}
      observed:
        - node_count
        - filler_arrow_count
        - occupied_cell_count
        - actual_empty_ratio
        - edge_count
        - dependency_depth
        - initial_extractable_count
        - initial_extractable_ratio
        - forced_state_count
        - forced_state_ratio
        - average_choice_count
        - choice_counts
        - attempt_count
        - selected_seed
        - has_complete_solution
      deferred:
        - "total_arrow_count·edge_count·average_choice_count·forced_state_count를 새 채택 조건으로 사용하는 기능"
        - "평균 길이·길이 분산·꺾임·방향 편중·지역 밀도 등의 형상·시각 지표"
        - "fan-in·fan-out·의존 밀도·구성요소·모듈·관문·해답 분기 지표"
        - "시간 제한·실수 제한·힌트 및 플레이 템포 설정"
    status: verified
    verification_mode: independent_qa
    evidence: ["tools/balance_sheet/schema.mjs", "tools/balance_sheet/tests/schema.test.mjs", "data/stage_balance.json"]
    replaces: []
    closeout_disposition: apply
  - id: SOT-007-GOOGLE-SHEETS-AUTHORING
    target: sections.balance.authoring.workflow
    operation: add
    content:
      canonical_source: "Google Sheets의 stage_profiles 탭을 운영 밸런스 원본으로 사용한다."
      tabs:
        _meta:
          protection: warning_protected
          header_row: 1
          columns: [key, value, description]
          required_rows:
            - {row: 2, key: schema_version, value: 1}
            - {row: 3, key: project_id, value: pickup-arrow}
            - {row: 4, key: profile_sheet, value: stage_profiles}
            - {row: 5, key: metric_guide_sheet, value: metric_guide}
        stage_profiles:
          protection: "1행 헤더는 보호하고 2행 이후 운영 데이터만 편집한다."
          header_row: 1
          data_start_row: 2
          columns:
            - {order: 1, field: stage_id, type: string, required: true, constraint: "stable ID, 중복 금지"}
            - {order: 2, field: stage_order, type: int, required: true, constraint: "1 이상, 중복 금지, 진행 순서"}
            - {order: 3, field: expected_difficulty_level, type: int, required: false, constraint: "blank 또는 1..100"}
            - {order: 4, field: grid_width, type: int, required: true, constraint: "1..999"}
            - {order: 5, field: grid_height, type: int, required: true, constraint: "1..999, width x height <= 10000"}
            - {order: 6, field: seed, type: int, required: true, constraint: "0..2147483647"}
            - {order: 7, field: primary_arrow_count, type: int, required: true, constraint: "1..playable_cell_count"}
            - {order: 8, field: min_length, type: int, required: true, constraint: "1..playable_cell_count"}
            - {order: 9, field: max_length, type: int, required: true, constraint: "min_length..playable_cell_count"}
            - {order: 10, field: target_empty_ratio, type: float, required: true, constraint: "0.0..1.0"}
            - {order: 11, field: filler_max_length, type: int, required: true, constraint: "1..playable_cell_count"}
            - {order: 12, field: min_dependency_depth, type: int, required: true, constraint: ">= 1"}
            - {order: 13, field: max_dependency_depth, type: int, required: true, constraint: ">= min_dependency_depth"}
            - {order: 14, field: min_initial_extractable_ratio, type: float, required: true, constraint: "0.0..1.0"}
            - {order: 15, field: max_initial_extractable_ratio, type: float, required: true, constraint: "min..1.0"}
            - {order: 16, field: min_forced_state_ratio, type: float, required: true, constraint: "0.0..1.0"}
            - {order: 17, field: max_forced_state_ratio, type: float, required: true, constraint: "min..1.0"}
            - {order: 18, field: max_candidate_attempts, type: int, required: true, constraint: "1..256, 권장 64"}
            - {order: 19, field: operator_note, type: string, required: false, constraint: "운영 메모, 런타임 산출물에서 제외"}
          sample_row:
            stage_id: STAGE-001
            stage_order: 1
            expected_difficulty_level: null
            grid_width: 9
            grid_height: 9
            seed: 1001
            primary_arrow_count: 3
            min_length: 1
            max_length: 6
            target_empty_ratio: 0.70
            filler_max_length: 3
            min_dependency_depth: 2
            max_dependency_depth: 4
            min_initial_extractable_ratio: 0.50
            max_initial_extractable_ratio: 1.00
            min_forced_state_ratio: 0.00
            max_forced_state_ratio: 0.25
            max_candidate_attempts: 64
            operator_note: ""
        metric_guide:
          protection: warning_protected
          header_row: 1
          columns:
            - metric_id
            - classification
            - group
            - value_type
            - required
            - allowed_range
            - default_value
            - stage_profiles_column
            - description
          classifications: [configurable, observed, deferred]
          description_language: ko
      row_rules:
        - "stage_profiles는 정확한 19개 표준 헤더를 지정 순서대로 사용한다."
        - "완전히 빈 행은 무시하고 일부 필수 셀만 빈 행은 거절한다."
        - "표준 입력 셀은 수식이 아닌 리터럴 값만 사용한다."
        - "행 위치는 의미가 없으며 stage_order가 진행 순서를 결정하고 동기화 결과는 stage_order, stage_id 순으로 정규화한다."
        - "stage_id와 stage_order는 각각 중복할 수 없다."
        - "필터, 고정 행, 조건부 서식, 셀 메모는 데이터 의미를 바꾸지 않으므로 허용한다."
      analysis_policy: "analysis_ 접두사 탭은 운영 분석용으로 허용하지만 동기화 입력에서는 무시한다. 표준 탭의 임의 열 추가는 거절한다."
      new_stage_policy: "새 stable stage_id와 고유 stage_order를 가진 유효한 행은 현재 결정적 생성기를 사용하는 새 스테이지를 만든다. 별도 맵 콘텐츠가 없으면 전체 직사각 보드를 사용한다."
      content_boundary: "mask_rows와 고정 화살 배치 등 맵 콘텐츠는 이번 시트에 넣지 않고 같은 stage_id의 기존 콘텐츠가 있을 때만 결합한다. 고정·랜덤 모드 선택은 후속 범위다."
      schema_version: "_meta!A2:B2의 schema_version이 지원 값 1과 일치해야 하며 필수 탭·헤더·중복 stage_id 오류는 전체 동기화를 거절한다."
      runtime_source: "게임은 검증을 통과해 저장소에 생성된 로컬 스냅샷만 읽는다."
      publication: "원격 시트 변경은 데이터 검증·게시와 로컬 동기화를 모두 통과하기 전까지 실행 게임과 배포 빌드를 바꾸지 않는다."
      operator_flow:
        - "Google Sheets에서 기존 스테이지 값을 수정하거나 새 stage_id와 stage_order 행을 추가한다."
        - "Pickup Arrow 메뉴의 데이터 검증을 실행해 마지막 정상 JSON 게시본을 갱신한다."
        - "로컬 Sync & Preview를 실행한다."
        - "로컬 재검증 성공 시 새 스냅샷과 선택 스테이지 미리보기를 확인한다."
        - "검토한 로컬 스냅샷을 버전 관리하고 게임을 다시 빌드·배포한다."
      exclusions:
        - manual_csv_import
        - runtime_direct_google_access
        - preview_writeback_to_sheet
        - dedicated_balance_editor
    status: user_accepted
    verification_mode: user_check
    evidence: ["tools/balance_sheet/schema.mjs", "tools/balance_sheet/apps_script/Code.gs", "tools/balance_sheet/README.md", "data/stage_balance.json"]
    replaces: []
    closeout_disposition: apply
  - id: SOT-007-BALANCE-SHEET-LIFECYCLE-SYSTEM
    target: sections.systems.SYS-BALANCE-SHEET-LIFECYCLE
    operation: add
    content:
      responsibility: "빈 Google Sheets의 최초 구성과 지원되는 schema_version 사이의 구조 마이그레이션을 자동화한다."
      execution_boundary: "Node.js 22 로컬 authoring CLI가 내장 fetch·crypto만 사용하며 게임 런타임과 분리된다."
      api_contract: "spreadsheets.get으로 사전 상태를 확인하고 하나의 spreadsheets.batchUpdate 요청으로 구조·값·검증·보호를 함께 적용한다."
      oauth_scope: "https://www.googleapis.com/auth/spreadsheets"
      setup: "서비스 계정에 임시 Editor 권한을 부여한 상태에서 세 표준 탭, 헤더, 기존 STAGE-001~003 행, 데이터 검증, 보호 범위와 metric_guide를 생성한다."
      migration: "필드 추가·삭제·이름 변경은 수동 열 편집이 아니라 명시적 이전 버전→새 버전 마이그레이션으로 실행한다."
      preservation: "구조 변경 전에 기존 표준 탭 값의 복구 가능한 백업을 만들고, 변환·재검증이 모두 통과한 경우에만 새 schema_version을 확정한다."
      permissions:
        human_operator: "시트 소유자 또는 편집자로서 stage_profiles의 운영 값을 계속 수정한다."
        service_account_setup: "최초 Setup과 구조 Migrate 동안만 Editor 파일 권한과 쓰기 API 범위를 사용한다."
        service_account_sync: "정상 운영에서는 Viewer 파일 권한과 읽기 전용 API 범위만 사용한다."
      postcondition: "Setup 또는 Migrate 성공 후 운영자가 서비스 계정을 Viewer로 되돌릴 수 있도록 상태와 안내를 표시한다."
      failure_policy: "부분 구조를 정상 버전으로 표시하지 않고 백업과 기존 지원 버전을 보존하며 실패 단계와 셀·필드 원인을 반환한다."
      states: [inspecting, backing_up, writing, validating, ready, failed]
    status: superseded
    verification_mode: independent_qa
    evidence: ["tools/balance_sheet/cli.mjs", "tools/balance_sheet/sheets_requests.mjs", "tools/balance_sheet/tests/sheets.test.mjs"]
    replaces: []
    closeout_disposition: discard
  - id: SOT-007-BALANCE-SYNC-SYSTEM
    target: sections.systems.SYS-BALANCE-SYNC
    operation: add
    content:
      responsibility: "읽기 전용 인증으로 Google Sheets 원본을 가져와 전체 행을 검증·정규화하고 런타임용 로컬 스냅샷을 생성한다."
      execution_boundary: "Node.js 22 로컬 authoring CLI가 서비스 계정 JWT를 발급하고 Google Sheets REST API를 호출한다."
      api_contract: "spreadsheets.values.batchGet으로 _meta!A1:C5, stage_profiles!A1:S, metric_guide!A1:I를 한 번에 읽는다."
      oauth_scope: "https://www.googleapis.com/auth/spreadsheets.readonly"
      input: [spreadsheet_id, stage_profiles_range, schema_version, read_only_credentials]
      output: [normalized_stage_profiles, source_revision, content_hash, validation_result]
      authentication: "서비스 계정 또는 동등한 읽기 전용 자격은 로컬 환경에서만 제공하고 저장소와 게임 빌드에 포함하지 않는다."
      atomicity: "모든 행이 통과할 때만 stage_order, stable stage_id 순서의 새 스냅샷으로 교체한다."
      failure_policy: "인증·네트워크·스키마·값 검증 실패 시 기존 정상 스냅샷을 보존하고 시트명·행·열·필드·원인을 반환한다."
      determinism: "동일한 시트 값과 스키마 버전은 동일한 정규화 순서와 content_hash를 만든다."
      snapshot_contract:
        root_fields: [schema_version, source_revision, content_hash, profiles]
        profile_order: [stage_order, stage_id]
        content_hash: "content_hash를 제외한 schema_version과 profiles의 canonical JSON에 SHA-256을 적용한다."
        replacement: "같은 디렉터리의 임시 파일을 완전히 기록·검증한 뒤 최종 스냅샷을 교체한다."
    status: superseded
    verification_mode: independent_qa
    evidence: ["tools/balance_sheet/cli.mjs", "tools/balance_sheet/snapshot_io.mjs", "tools/balance_sheet/tests/sheets.test.mjs"]
    replaces: []
    closeout_disposition: discard
  - id: SOT-007-BALANCE-SHEET-APPS-SCRIPT-LIFECYCLE
    target: sections.systems.SYS-BALANCE-SHEET-LIFECYCLE
    operation: replace
    content:
      responsibility: "Google Sheets에 바인드된 Apps Script가 최초 구성, 구조 마이그레이션과 운영 데이터 검증을 수행한다."
      execution_boundary: "메뉴 작업은 현재 시트를 편집 중인 사람의 권한으로 실행하며 서비스 계정·JSON 키·Google Cloud Console을 사용하지 않는다."
      menu: [최초 구성, 구조 마이그레이션, 데이터 검증]
      setup: "빈 문서에 _meta, stage_profiles, metric_guide와 초기 STAGE-001~003, 입력 검증과 보호 경고를 생성한 뒤 전체 검증한다."
      migration: "지원되는 이전 schema_version만 백업 후 변환하며 새 구조 전체가 유효할 때만 버전을 확정한다."
      schema_v1_maintenance: "구버전 metric_guide 설명을 한글로 갱신하고 기존 guide를 숨겨진 백업 탭에 보존한다."
      validation: "필수 탭·헤더·리터럴 값·타입·범위·교차 필드·중복 ID와 순서를 검사하고 셀 위치가 포함된 오류를 반환한다."
      preservation: "구조 변경 전 표준 탭의 복구 가능한 사본을 보존하고 실패 시 기존 지원 구조를 정상 버전으로 유지한다."
      failure_policy: "부분 구성과 부분 마이그레이션을 완료로 표시하지 않고 원인과 복구 대상을 표시한다."
      states: [inspecting, backing_up, writing, validating, ready, failed]
    status: verified
    verification_mode: independent_qa
    evidence: ["tools/balance_sheet/apps_script/Code.gs", "tools/balance_sheet/tests/apps_script.test.mjs"]
    replaces: [SOT-007-BALANCE-SHEET-LIFECYCLE-SYSTEM]
    closeout_disposition: apply
  - id: SOT-007-BALANCE-APPS-SCRIPT-SYNC-SYSTEM
    target: sections.systems.SYS-BALANCE-SYNC
    operation: replace
    content:
      responsibility: "Apps Script 웹 앱이 검증된 밸런스 JSON을 읽기 전용으로 제공하고 로컬 authoring 도구가 이를 재검증해 런타임 스냅샷으로 저장한다."
      endpoint:
        method: GET
        access: anonymous
        execute_as: deployer
        output: [schema_version, source_revision, content_hash, profiles]
        exclusion: [sheet_url, spreadsheet_id, operator_note, credentials, write_action]
        source: "데이터 검증 성공 시 ScriptProperties에 게시된 마지막 정상 snapshot"
        sheet_access: "웹 앱 실행에서는 시트를 열지 않는다."
      publication:
        trigger: "Pickup Arrow 메뉴의 데이터 검증 성공"
        storage: "UTF-8 snapshot JSON을 Base64 8000자 이하 chunk와 manifest로 ScriptProperties에 저장한다."
        concurrency: "게시와 doGet은 script lock으로 직렬화한다."
        payload_limit: 450000
        failure: "게시 실패 시 저장 전 property 집합을 복구하고 이전 정상 게시본을 유지한다."
      local_sync:
        execution_boundary: "Node.js 22 로컬 authoring 도구만 웹 앱 URL을 호출하며 게임 런타임은 원격 요청을 하지 않는다."
        input: [apps_script_web_app_url]
        redirect: "Apps Script ContentService의 응답 리다이렉트를 따라 최종 JSON을 읽는다."
        validation: "응답의 schema_version, 전체 profile, 정렬과 content_hash를 로컬에서 다시 검증한다."
        atomicity: "검증된 임시 파일을 완전히 기록한 뒤 data/stage_balance.json을 교체한다."
      exposure: "웹 앱 URL을 아는 사용자는 런타임용 밸런스 JSON을 읽을 수 있지만 시트 원본을 보거나 수정할 권한은 얻지 않는다."
      failure_policy: "네트워크·HTTP·JSON·스키마·값 검증 실패 시 기존 정상 스냅샷과 미리보기를 보존한다."
      determinism: "동일한 유효 시트 값은 동일한 profile 순서와 content_hash를 반환한다."
    status: verified
    verification_mode: independent_qa
    evidence: ["tools/balance_sheet/cli.mjs", "tools/balance_sheet/tests/sheets.test.mjs", "scripts/balance_preview.gd"]
    replaces: [SOT-007-BALANCE-SYNC-SYSTEM]
    closeout_disposition: apply
  - id: SOT-007-STAGE-BALANCE-PREVIEW
    target: sections.systems.SYS-STAGE-BALANCE-PREVIEW
    operation: add
