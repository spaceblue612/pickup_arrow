="1338" y="306" font-size="14" font-weight="400" fill="#333">직접 지정</text><rect x="254" y="330" width="1308" height="60" rx="0" fill="#fff" stroke="#ddd"/><text x="272" y="366" font-size="17" font-weight="600" fill="#333">연쇄</text><text x="480" y="366" font-size="15" font-weight="400" fill="#333">선행 관계 깊이: 미설정</text><text x="756" y="366" font-size="15" font-weight="400" fill="#333">압박 반복: 미설정</text><text x="1020" y="366" font-size="14" font-weight="400" fill="#333">대상·적용량 미설정</text><text x="1338" y="366" font-size="14" font-weight="400" fill="#333">직접 / 자동</text><rect x="254" y="390" width="1308" height="60" rx="0" fill="#e9e9e9" stroke="#ddd"/><text x="272" y="426" font-size="17" font-weight="600" fill="#333">영역 개방</text><text x="480" y="426" font-size="15" font-weight="400" fill="#333">새로 열림: 3개 이상 (예시)</text><text x="756" y="426" font-size="15" font-weight="400" fill="#333">반복: 미설정</text><text x="1020" y="426" font-size="14" font-weight="400" fill="#333">대상 R2 / 적용량 미설정</text><text x="1338" y="426" font-size="14" font-weight="400" fill="#333">직접 지정</text><rect x="232" y="500" width="832" height="522" rx="5" fill="#fff" stroke="#ccc"/><text x="254" y="539" font-size="21" font-weight="600" fill="#333">선택한 요소만 상세 편집 · 영역 개방</text><text x="254" y="584" font-size="16" font-weight="600" fill="#333">목표 수준</text><rect x="416" y="560" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="428" y="584" font-size="15" font-weight="400" fill="#333">새로 제거 가능해지는 수 ▾</text><rect x="700" y="560" width="336" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="712" y="584" font-size="15" font-weight="400" fill="#333">3개 이상 (설명용 입력)</text><text x="254" y="642" font-size="16" font-weight="600" fill="#333">등장 빈도</text><rect x="416" y="618" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="428" y="642" font-size="15" font-weight="400" fill="#333">간격 지정 / 발생 확률 ▾</text><rect x="700" y="618" width="336" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="712" y="642" font-size="15" font-weight="400" fill="#333">값·기준 단위 미설정</text><text x="254" y="700" font-size="16" font-weight="600" fill="#333">적용 범위</text><rect x="416" y="676" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="428" y="700" font-size="15" font-weight="400" fill="#333">영향 영역: R2 ▾</text><rect x="700" y="676" width="336" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="712" y="700" font-size="15" font-weight="400" fill="#333">풀이 적용 구간: 미설정</text><text x="254" y="758" font-size="16" font-weight="600" fill="#333">커버리지</text><rect x="416" y="734" width="620" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="428" y="758" font-size="15" font-weight="400" fill="#333">적용할 양 / 비율 / 집계 단위: 후속 정의</text><text x="254" y="816" font-size="16" font-weight="600" fill="#333">설정 출처</text><rect x="416" y="792" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="428" y="816" font-size="15" font-weight="400" fill="#333">직접 지정 ▾</text><rect x="700" y="792" width="336" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="712" y="816" font-size="15" font-weight="400" fill="#333">스테이지별 자동 조정…</text><text x="254" y="876" font-size="15" font-weight="400" fill="#555">새 요소도 같은 설정 틀에 추가하되, 계산 방식은 요소별로 정의합니다.</text><text x="254" y="906" font-size="15" font-weight="400" fill="#555">빈도와 강도는 별개이며 발생 확률이 일정 간격을 보장하지는 않습니다.</text><text x="254" y="936" font-size="15" font-weight="400" fill="#555">선행 관계의 깊이와 압박 구간의 반복 횟수도 구분합니다.</text><rect x="1080" y="500" width="504" height="522" rx="5" fill="#fff" stroke="#ccc"/><text x="1102" y="539" font-size="20" font-weight="600" fill="#333">확인할 정의는 여기로 모읍니다</text><text x="1102" y="585" font-size="16" font-weight="600" fill="#333">아직 확정하지 않은 부분</text><text x="1102" y="621" font-size="15" font-weight="400" fill="#555">• 반복 사건의 시작·끝 기준</text><text x="1102" y="652" font-size="15" font-weight="400" fill="#555">• 간격의 기준: 진행률 / 제거 수 등</text><text x="1102" y="683" font-size="15" font-weight="400" fill="#555">• 커버리지 단위와 분모·중복 처리</text><text x="1102" y="714" font-size="15" font-weight="400" fill="#555">• 자동 조정의 계산식과 상하한</text><text x="1102" y="745" font-size="15" font-weight="400" fill="#555">• 필수 조건 / 권장 목표의 구분</text><text x="1102" y="820" font-size="16" font-weight="600" fill="#333">입력 예시는 구현 완료가 아닙니다</text><text x="1102" y="856" font-size="15" font-weight="400" fill="#555">맵을 생성하거나 목표를 검증하는 기능은</text><text x="1102" y="885" font-size="15" font-weight="400" fill="#555">아직 연결하지 않았습니다. 빈도·커버리지는</text><text x="1102" y="914" font-size="15" font-weight="400" fill="#555">합의 전 임의로 계산하지 않습니다.</text><rect x="1102" y="961" width="456" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1114" y="985" font-size="15" font-weight="400" fill="#333">분석에서 목표와 결과 비교 →</text></g></svg></section>

<script>
const buttons=[...document.querySelectorAll('button[data-tab]')],panels=[...document.querySelectorAll('main>section')];
function show(index){buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));panels.forEach((p,i)=>p.hidden=i!==index);}
buttons.forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.tab))));
