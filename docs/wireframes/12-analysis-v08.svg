<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>스테이지 목록을 유지하며 주요 전환점을 분석</title><desc>v0.8 기획 목업. 스테이지 목록과 조건 요약을 작업 보드와 함께 보여줍니다. 목록과 저장 조작은 예시이며 상세 설정 팝업 열기와 화면 전환만 동작합니다.</desc><g font-family="'Noto Sans CJK KR',sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#f2f2f2" stroke="none"/><text x="22" y="26" font-size="14" font-weight="400" fill="#666">와이어프레임 v0.8 · 목록·순번·후보·입력은 예시 / 보드 수치는 검증용 맵</text><rect x="0" y="42" width="1600" height="74" rx="0" fill="#fff" stroke="#bbb"/><text x="24" y="87" font-size="23" font-weight="600" fill="#333">Arrow Stage Editor</text><text x="310" y="85" font-size="17" font-weight="400" fill="#333">STAGE-004 · 순번 004 · 후보 A / v1 (표시 예시)</text><g role="button" tabindex="0" data-screen="work" style="cursor:pointer"><rect x="842" y="60" width="100" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="854" y="84" font-size="15" font-weight="400" fill="#333">작업</text></g><g role="button" tabindex="0" data-screen="analysis" style="cursor:pointer"><rect x="954" y="60" width="100" height="36" rx="5" fill="#333" stroke="#333"/><text x="966" y="84" font-size="15" font-weight="600" fill="white">분석</text></g><rect x="1066" y="60" width="116" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1078" y="84" font-size="15" font-weight="400" fill="#333">맵 비교…</text><rect x="1194" y="60" width="130" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1206" y="84" font-size="15" font-weight="400" fill="#333">저장</text><rect x="1336" y="60" width="240" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1348" y="84" font-size="15" font-weight="400" fill="#333">새 후보로 저장</text><rect x="16" y="134" width="198" height="906" rx="5" fill="#fff" stroke="#ccc"/><text x="34" y="169" font-size="19" font-weight="600" fill="#333">스테이지 관리</text><rect x="30" y="188" width="170" height="35" rx="5" fill="#fafafa" stroke="#ccc"/><text x="41" y="211" font-size="14" font-weight="400" fill="#888">ID / 이름 검색</text><text x="32" y="245" font-size="13" font-weight="600" fill="#333">순번</text><text x="82" y="245" font-size="13" font-weight="600" fill="#333">스테이지 ID · 상태</text><rect x="28" y="257" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="282" font-size="13" font-weight="600" fill="#333">001</text><text x="77" y="281" font-size="13" font-weight="600" fill="#333">STAGE-001</text><text x="77" y="301" font-size="11" font-weight="400" fill="#666">확정안 있음 (예시)</text><rect x="28" y="322" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="347" font-size="13" font-weight="600" fill="#333">002</text><text x="77" y="346" font-size="13" font-weight="600" fill="#333">STAGE-002</text><text x="77" y="366" font-size="11" font-weight="400" fill="#666">확정안 있음 (예시)</text><rect x="28" y="387" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="412" font-size="13" font-weight="600" fill="#333">003</text><text x="77" y="411" font-size="13" font-weight="600" fill="#333">STAGE-003</text><text x="77" y="431" font-size="11" font-weight="400" fill="#666">확정안 있음 (예시)</text><rect x="28" y="452" width="174" height="56" rx="5" fill="#e5e5e5" stroke="#555"/><text x="37" y="477" font-size="13" font-weight="600" fill="#333">004</text><text x="77" y="476" font-size="13" font-weight="600" fill="#333">STAGE-004</text><text x="77" y="496" font-size="11" font-weight="400" fill="#666">현재 작업 · 후보 A</text><rect x="28" y="517" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="542" font-size="13" font-weight="600" fill="#333">005</text><text x="77" y="541" font-size="13" font-weight="600" fill="#333">STAGE-005</text><text x="77" y="561" font-size="11" font-weight="400" fill="#666">작업 전 (예시)</text><rect x="28" y="582" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="607" font-size="13" font-weight="600" fill="#333">006</text><text x="77" y="606" font-size="13" font-weight="600" fill="#333">STAGE-006</text><text x="77" y="626" font-size="11" font-weight="400" fill="#666">작업 전 (예시)</text><rect x="28" y="647" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="672" font-size="13" font-weight="600" fill="#333">007</text><text x="77" y="671" font-size="13" font-weight="600" fill="#333">STAGE-007</text><text x="77" y="691" font-size="11" font-weight="400" fill="#666">작업 전 (예시)</text><text x="94" y="742" font-size="22" font-weight="600" fill="#333">⋮</text><text x="36" y="776" font-size="13" font-weight="400" fill="#666">… STAGE-N까지 스크롤</text><rect x="30" y="804" width="170" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="828" font-size="15" font-weight="400" fill="#333">+ 스테이지 추가</text><rect x="30" y="849" width="170" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="873" font-size="15" font-weight="400" fill="#333">선택 스테이지 복제</text><rect x="30" y="894" width="80" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="918" font-size="15" font-weight="400" fill="#333">↑ 위로</text><rect x="120" y="894" width="80" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="132" y="918" font-size="15" font-weight="400" fill="#333">↓ 아래로</text><text x="32" y="961" font-size="12" font-weight="400" fill="#555">순번과 ID는 별도로 표시</text><text x="32" y="986" font-size="12" font-weight="400" fill="#555">목록·순서 변경은 정적 예시</text><text x="24" y="1072" font-size="14" font-weight="400" fill="#666">현재 2단계 기획 · 상세 설정은 팝업 / 작업과 핵심 세 조건은 한 화면 / 스테이지 목록 유지</text><rect x="232" y="134" width="1352" height="174" rx="5" fill="#fff" stroke="#ccc"/><text x="254" y="169" font-size="22" font-weight="600" fill="#333">분석 · 주요 전환점만 기본 표시</text><text x="254" y="202" font-size="16" font-weight="400" fill="#333">검증 예시: 같은 원본 맵의 합법 제거 경로 1개 / 모든 풀이 순서의 통계는 아님</text><rect x="254" y="225" width="228" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="266" y="249" font-size="15" font-weight="400" fill="#333">시작 · Z 제거 가능</text><text x="499" y="250" font-size="23" font-weight="400" fill="#333">→</text><rect x="538" y="225" width="280" height="36" rx="5" fill="#333" stroke="#333"/><text x="550" y="249" font-size="15" font-weight="600" fill="white">Z·H 제거 · 관문 G 가능</text><text x="834" y="250" font-size="23" font-weight="400" fill="#333">→</text><rect x="873" y="225" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="885" y="249" font-size="15" font-weight="400" fill="#333">G 제거 · R2 개방</text><rect x="1228" y="225" width="330" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1240" y="249" font-size="15" font-weight="400" fill="#333">모든 제거 스텝 펼치기 ▾</text><rect x="232" y="326" width="968" height="454" rx="5" fill="#fff" stroke="#ccc"/><text x="254" y="363" font-size="20" font-weight="600" fill="#333">선택 시점: Z·H 제거 후 · 관문 직전</text><g transform="translate(300,370) scale(0.83)"><rect x="60" y="45" width="504" height="378" rx="0" fill="#fafafa" stroke="#ddd"/><path d="M102 45v378" stroke="#e8e8e8"/><path d="M144 45v378" stroke="#e8e8e8"/><path d="M186 45v378" stroke="#e8e8e8"/><path d="M228 45v378" stroke="#e8e8e8"/><path d="M270 45v378" stroke="#e8e8e8"/><path d="M312 45v378" stroke="#e8e8e8"/><path d="M354 45v378" stroke="#e8e8e8"/><path d="M396 45v378" stroke="#e8e8e8"/><path d="M438 45v378" stroke="#e8e8e8"/><path d="M480 45v378" stroke="#e8e8e8"/><path d="M522 45v378" stroke="#e8e8e8"/><path d="M60 87h504" stroke="#e8e8e8"/><path d="M60 129h504" stroke="#e8e8e8"/><path d="M60 171h504" stroke="#e8e8e8"/><path d="M60 213h504" stroke="#e8e8e8"/><path d="M60 255h504" stroke="#e8e8e8"/><path d="M60 297h504" stroke="#e8e8e8"/><path d="M60 339h504" stroke="#e8e8e8"/><path d="M60 381h504" stroke="#e8e8e8"/><rect x="60" y="45" width="420" height="126" rx="0" fill="#ececec" stroke="#777"/><text x="295" y="70" font-size="15" font-weight="600" fill="#333">R1 · 선행 구간</text><rect x="144" y="171" width="294" height="210" rx="0" fill="#f4f4f4" stroke="#888"/><text x="152" y="371" font-size="15" font-weight="600" fill="#333">R2 · 개방 대상</text><g opacity="0.42"><path d="M95 66L75 66" stroke="#bbb" stroke-width="6" stroke-linecap="round"/><path d="M67 66L86 56L86 76Z" fill="#bbb"/><text x="96" y="52" font-size="14" font-weight="600" fill="#bbb">Z</text></g><g opacity="0.42"><path d="M81 164L81 144" stroke="#bbb" stroke-width="6" stroke-linecap="round"/><path d="M81 136L91 155L71 155Z" fill="#bbb"/><text x="96" y="136" font-size="14" font-weight="600" fill="#bbb">H</text></g><g opacity="1"><polyline points="459,150 417,150 375,150 333,150 291,150 249,150 207,150 165,150 123,150" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M109 150L128 140L128 160Z" fill="#222"/><text x="138" y="136" font-size="14" font-weight="600" fill="#222">G · 관문</text><text x="280" y="180" font-size="13" font-weight="400" fill="#555">A·B·C의 위쪽 탈출 경로를 차단</text></g><g opacity="1"><polyline points="207,276 207,234" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M207 220L217 239L197 239Z" fill="#777"/><text x="222" y="220" font-size="14" font-weight="600" fill="#777">A</text></g><g opacity="1"><polyline points="291,276 291,234" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M291 220L301 239L281 239Z" fill="#777"/><text x="306" y="220" font-size="14" font-weight="600" fill="#777">B</text></g><g opacity="1"><polyline points="375,276 375,234" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M375 220L385 239L365 239Z" fill="#777"/><text x="390" y="220" font-size="14" font-weight="600" fill="#777">C</text></g><path d="M207 212V162" stroke="#888" stroke-dasharray="4 5" fill="none"/><path d="M291 212V162" stroke="#888" stroke-dasharray="4 5" fill="none"/><path d="M375 212V162" stroke="#888" stroke-dasharray="4 5" fill="none"/><text x="60" y="455" font-size="14" font-weight="400" fill="#666">진한 화살: 제거 가능 / 회색: 막힘 / 흐린 화살: 이미 제거</text></g><text x="938" y="415" font-size="16" font-weight="600" fill="#333">지금 남은 수 4개</text><text x="938" y="451" font-size="15" font-weight="400" fill="#555">제거 가능 G 1개</text><text x="938" y="481" font-size="15" font-weight="400" fill="#555">막힘 A·B·C 3개</text><text x="938" y="511" font-size="15" font-weight="400" fill="#555">R2 막힘 100%</text><text x="938" y="603" font-size="16" font-weight="600" fill="#333">선행 연결 유지</text><text x="938" y="639" font-size="14" font-weight="400" fill="#555">Z → H → G</text><text x="938" y="668" font-size="14" font-weight="400" fill="#555">앞선 제거도 원본에 표시</text><rect x="1216" y="326" width="368" height="454" rx="5" fill="#fff" stroke="#ccc"/><text x="1236" y="363" font-size="20" font-weight="600" fill="#333">관문 G의 제거 전 → 후</text><text x="1236" y="409" font-size="17" font-weight="600" fill="#333">R2 · 영역 개방</text><text x="1236" y="449" font-size="17" font-weight="400" fill="#555">남은 화살: 3 → 3개</text><text x="1236" y="488" font-size="17" font-weight="400" fill="#555">제거 가능: 0 → 3개</text><text x="1236" y="527" font-size="17" font-weight="400" fill="#555">막힌 수: 3 → 0개</text><text x="1236" y="566" font-size="17" font-weight="400" fill="#555">막힘 비율: 100% → 0%</text><text x="1236" y="632" font-size="15" font-weight="600" fill="#333">설계 의도와 검증 근거를 분리</text><text x="1236" y="665" font-size="14" font-weight="400" fill="#555">의도 예시: G가 R2를 개방</text><text x="1236" y="693" font-size="14" font-weight="400" fill="#555">근거: Z → H → G의 합법 제거</text><text x="1236" y="721" font-size="14" font-weight="400" fill="#555">다른 버전에는 이 결과를 재사용 안 함</text><rect x="232" y="798" width="1352" height="224" rx="5" fill="#fff" stroke="#ccc"/><text x="254" y="833" font-size="20" font-weight="600" fill="#333">반복 압박·커버리지의 결과는 별도 분석 항목</text><rect x="254" y="852" width="756" height="137" rx="5" fill="#f6f6f6" stroke="#ccc"/><text x="274" y="883" font-size="16" font-weight="400" fill="#555">이 예시에서 확인: 관문 1개, R2 제거 가능 수 0 → 3개</text><text x="274" y="912" font-size="16" font-weight="400" fill="#555">아직 확인하지 않음: 압박 구간의 반복 빈도·커버리지</text><text x="274" y="941" font-size="16" font-weight="400" fill="#555">횟수 0 또는 성공으로 처리하지 않고 ‘미검증’으로 표시합니다.</text><text x="1030" y="878" font-size="15" font-weight="400" fill="#555">원본 관계와 실행 이력을 함께 보존</text><text x="1030" y="907" font-size="15" font-weight="400" fill="#555">편집하면 이전 분석임을 표시</text><text x="1030" y="936" font-size="15" font-weight="400" fill="#555">매 스텝 상세는 필요할 때만 확인</text><text x="1030" y="965" font-size="15" font-weight="400" fill="#555">목표 충족 / 미달 / 미검증을 구분</text></g></svg>
