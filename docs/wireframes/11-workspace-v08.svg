<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>작업 보드 + 맵 조건 요약 + 스테이지 순번 관리</title><desc>v0.8 기획 목업. 스테이지 목록과 조건 요약을 작업 보드와 함께 보여줍니다. 목록과 저장 조작은 예시이며 상세 설정 팝업 열기와 화면 전환만 동작합니다.</desc><g font-family="'Noto Sans CJK KR',sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#f2f2f2" stroke="none"/><text x="22" y="26" font-size="14" font-weight="400" fill="#666">와이어프레임 v0.8 · 목록·순번·후보·입력은 예시 / 보드 수치는 검증용 맵</text><rect x="0" y="42" width="1600" height="74" rx="0" fill="#fff" stroke="#bbb"/><text x="24" y="87" font-size="23" font-weight="600" fill="#333">Arrow Stage Editor</text><text x="310" y="85" font-size="17" font-weight="400" fill="#333">STAGE-004 · 순번 004 · 후보 A / v1 (표시 예시)</text><g role="button" tabindex="0" data-screen="work" style="cursor:pointer"><rect x="842" y="60" width="100" height="36" rx="5" fill="#333" stroke="#333"/><text x="854" y="84" font-size="15" font-weight="600" fill="white">작업</text></g><g role="button" tabindex="0" data-screen="analysis" style="cursor:pointer"><rect x="954" y="60" width="100" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="966" y="84" font-size="15" font-weight="400" fill="#333">분석</text></g><rect x="1066" y="60" width="116" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1078" y="84" font-size="15" font-weight="400" fill="#333">맵 비교…</text><rect x="1194" y="60" width="130" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1206" y="84" font-size="15" font-weight="400" fill="#333">저장</text><rect x="1336" y="60" width="240" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1348" y="84" font-size="15" font-weight="400" fill="#333">새 후보로 저장</text><rect x="16" y="134" width="198" height="906" rx="5" fill="#fff" stroke="#ccc"/><text x="34" y="169" font-size="19" font-weight="600" fill="#333">스테이지 관리</text><rect x="30" y="188" width="170" height="35" rx="5" fill="#fafafa" stroke="#ccc"/><text x="41" y="211" font-size="14" font-weight="400" fill="#888">ID / 이름 검색</text><text x="32" y="245" font-size="13" font-weight="600" fill="#333">순번</text><text x="82" y="245" font-size="13" font-weight="600" fill="#333">스테이지 ID · 상태</text><rect x="28" y="257" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="282" font-size="13" font-weight="600" fill="#333">001</text><text x="77" y="281" font-size="13" font-weight="600" fill="#333">STAGE-001</text><text x="77" y="301" font-size="11" font-weight="400" fill="#666">확정안 있음 (예시)</text><rect x="28" y="322" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="347" font-size="13" font-weight="600" fill="#333">002</text><text x="77" y="346" font-size="13" font-weight="600" fill="#333">STAGE-002</text><text x="77" y="366" font-size="11" font-weight="400" fill="#666">확정안 있음 (예시)</text><rect x="28" y="387" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="412" font-size="13" font-weight="600" fill="#333">003</text><text x="77" y="411" font-size="13" font-weight="600" fill="#333">STAGE-003</text><text x="77" y="431" font-size="11" font-weight="400" fill="#666">확정안 있음 (예시)</text><rect x="28" y="452" width="174" height="56" rx="5" fill="#e5e5e5" stroke="#555"/><text x="37" y="477" font-size="13" font-weight="600" fill="#333">004</text><text x="77" y="476" font-size="13" font-weight="600" fill="#333">STAGE-004</text><text x="77" y="496" font-size="11" font-weight="400" fill="#666">현재 작업 · 후보 A</text><rect x="28" y="517" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="542" font-size="13" font-weight="600" fill="#333">005</text><text x="77" y="541" font-size="13" font-weight="600" fill="#333">STAGE-005</text><text x="77" y="561" font-size="11" font-weight="400" fill="#666">작업 전 (예시)</text><rect x="28" y="582" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="607" font-size="13" font-weight="600" fill="#333">006</text><text x="77" y="606" font-size="13" font-weight="600" fill="#333">STAGE-006</text><text x="77" y="626" font-size="11" font-weight="400" fill="#666">작업 전 (예시)</text><rect x="28" y="647" width="174" height="56" rx="5" fill="#fff" stroke="#ddd"/><text x="37" y="672" font-size="13" font-weight="600" fill="#333">007</text><text x="77" y="671" font-size="13" font-weight="600" fill="#333">STAGE-007</text><text x="77" y="691" font-size="11" font-weight="400" fill="#666">작업 전 (예시)</text><text x="94" y="742" font-size="22" font-weight="600" fill="#333">⋮</text><text x="36" y="776" font-size="13" font-weight="400" fill="#666">… STAGE-N까지 스크롤</text><rect x="30" y="804" width="170" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="828" font-size="15" font-weight="400" fill="#333">+ 스테이지 추가</text><rect x="30" y="849" width="170" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="873" font-size="15" font-weight="400" fill="#333">선택 스테이지 복제</text><rect x="30" y="894" width="80" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="918" font-size="15" font-weight="400" fill="#333">↑ 위로</text><rect x="120" y="894" width="80" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="132" y="918" font-size="15" font-weight="400" fill="#333">↓ 아래로</text><text x="32" y="961" font-size="12" font-weight="400" fill="#555">순번과 ID는 별도로 표시</text><text x="32" y="986" font-size="12" font-weight="400" fill="#555">목록·순서 변경은 정적 예시</text><text x="24" y="1072" font-size="14" font-weight="400" fill="#666">현재 2단계 기획 · 상세 설정은 팝업 / 작업과 핵심 세 조건은 한 화면 / 스테이지 목록 유지</text><rect x="232" y="134" width="830" height="590" rx="5" fill="#fff" stroke="#ccc"/><text x="252" y="169" font-size="21" font-weight="600" fill="#333">작업 보드</text><text x="394" y="168" font-size="15" font-weight="400" fill="#555">생성·수동 배치 중에도 오른쪽 조건을 계속 확인</text><rect x="252" y="190" width="94" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="264" y="214" font-size="15" font-weight="400" fill="#333">선택</text><rect x="358" y="190" width="130" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="370" y="214" font-size="15" font-weight="400" fill="#333">화살표 배치</text><rect x="500" y="190" width="120" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="512" y="214" font-size="15" font-weight="400" fill="#333">영역 편집</text><rect x="632" y="190" width="152" height="36" rx="5" fill="#333" stroke="#333"/><text x="644" y="214" font-size="15" font-weight="600" fill="white">역할·연결 보기</text><rect x="796" y="190" width="138" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="808" y="214" font-size="15" font-weight="400" fill="#333">부분 생성…</text><g transform="translate(250,230) scale(1.10)"><rect x="60" y="45" width="504" height="378" rx="0" fill="#fafafa" stroke="#ddd"/><path d="M102 45v378" stroke="#e8e8e8"/><path d="M144 45v378" stroke="#e8e8e8"/><path d="M186 45v378" stroke="#e8e8e8"/><path d="M228 45v378" stroke="#e8e8e8"/><path d="M270 45v378" stroke="#e8e8e8"/><path d="M312 45v378" stroke="#e8e8e8"/><path d="M354 45v378" stroke="#e8e8e8"/><path d="M396 45v378" stroke="#e8e8e8"/><path d="M438 45v378" stroke="#e8e8e8"/><path d="M480 45v378" stroke="#e8e8e8"/><path d="M522 45v378" stroke="#e8e8e8"/><path d="M60 87h504" stroke="#e8e8e8"/><path d="M60 129h504" stroke="#e8e8e8"/><path d="M60 171h504" stroke="#e8e8e8"/><path d="M60 213h504" stroke="#e8e8e8"/><path d="M60 255h504" stroke="#e8e8e8"/><path d="M60 297h504" stroke="#e8e8e8"/><path d="M60 339h504" stroke="#e8e8e8"/><path d="M60 381h504" stroke="#e8e8e8"/><rect x="60" y="45" width="420" height="126" rx="0" fill="#ececec" stroke="#777"/><text x="295" y="70" font-size="15" font-weight="600" fill="#333">R1 · 선행 구간</text><rect x="144" y="171" width="294" height="210" rx="0" fill="#f4f4f4" stroke="#888"/><text x="152" y="371" font-size="15" font-weight="600" fill="#333">R2 · 개방 대상</text><path d="M95 66L75 66" stroke="#222" stroke-width="6" stroke-linecap="round"/><path d="M67 66L86 56L86 76Z" fill="#222"/><text x="96" y="52" font-size="14" font-weight="600" fill="#222">Z</text><path d="M81 164L81 144" stroke="#777" stroke-width="6" stroke-linecap="round"/><path d="M81 136L91 155L71 155Z" fill="#777"/><text x="96" y="136" font-size="14" font-weight="600" fill="#777">H</text><polyline points="459,150 417,150 375,150 333,150 291,150 249,150 207,150 165,150 123,150" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M109 150L128 140L128 160Z" fill="#777"/><text x="138" y="136" font-size="14" font-weight="600" fill="#777">G · 관문</text><polyline points="207,276 207,234" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M207 220L217 239L197 239Z" fill="#777"/><text x="222" y="220" font-size="14" font-weight="600" fill="#777">A</text><polyline points="291,276 291,234" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M291 220L301 239L281 239Z" fill="#777"/><text x="306" y="220" font-size="14" font-weight="600" fill="#777">B</text><polyline points="375,276 375,234" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M375 220L385 239L365 239Z" fill="#777"/><text x="390" y="220" font-size="14" font-weight="600" fill="#777">C</text><path d="M207 212V162" stroke="#888" stroke-dasharray="4 5" fill="none"/><path d="M291 212V162" stroke="#888" stroke-dasharray="4 5" fill="none"/><path d="M375 212V162" stroke="#888" stroke-dasharray="4 5" fill="none"/><text x="60" y="451" font-size="13" font-weight="400" fill="#666">진한 화살: 제거 가능 / 회색: 막힘 / 점선: 관문에 막힌 경로</text></g><text x="904" y="307" font-size="16" font-weight="600" fill="#333">현재</text><text x="904" y="343" font-size="14" font-weight="400" fill="#555">전체 6개</text><text x="904" y="372" font-size="14" font-weight="400" fill="#555">제거 가능 1개</text><text x="904" y="401" font-size="14" font-weight="400" fill="#555">막힘 5개</text><text x="904" y="518" font-size="15" font-weight="600" fill="#333">선택 영역</text><text x="904" y="551" font-size="14" font-weight="400" fill="#555">R2 · 3개</text><text x="904" y="579" font-size="14" font-weight="400" fill="#555">막힘 100%</text><rect x="1078" y="134" width="506" height="590" rx="5" fill="#fff" stroke="#ccc"/><text x="1098" y="169" font-size="20" font-weight="600" fill="#333">맵 조건 · 작업 중 상시 조회</text><g role="button" tabindex="0" data-open-profile="true" aria-label="맵 조건 상세 설정 열기" style="cursor:pointer"><rect x="1402" y="145" width="162" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1414" y="169" font-size="15" font-weight="400" fill="#333">상세 설정…</text></g><rect x="1094" y="194" width="474" height="146" rx="5" fill="#f9f9f9" stroke="#ccc"/><text x="1108" y="221" font-size="17" font-weight="600" fill="#333">① 풀이 가능 수</text><text x="1108" y="256" font-size="23" font-weight="600" fill="#333">1 / 6개</text><text x="1108" y="280" font-size="13" font-weight="400" fill="#666">현재 보드에서 바로 제거 가능</text><text x="1108" y="305" font-size="14" font-weight="400" fill="#333">목표: 1~2개 (입력 예시)</text><text x="1108" y="328" font-size="13" font-weight="400" fill="#555">빈도: 미설정 · 커버리지: 미설정</text><rect x="1094" y="352" width="474" height="146" rx="5" fill="#f9f9f9" stroke="#ccc"/><text x="1108" y="379" font-size="17" font-weight="600" fill="#333">② 연쇄</text><text x="1108" y="414" font-size="23" font-weight="600" fill="#333">선행 제거 2개</text><text x="1108" y="438" font-size="13" font-weight="400" fill="#666">관문 G까지 · Z → H → G</text><text x="1108" y="463" font-size="14" font-weight="400" fill="#333">목표: 미설정 / 압박 반복: 미검증</text><text x="1108" y="486" font-size="13" font-weight="400" fill="#555">빈도: 미설정 · 커버리지: 미설정</text><rect x="1094" y="510" width="474" height="156" rx="5" fill="#f9f9f9" stroke="#ccc"/><text x="1108" y="537" font-size="17" font-weight="600" fill="#333">③ 영역 개방</text><text x="1108" y="572" font-size="23" font-weight="600" fill="#333">R2: 0 / 3개</text><text x="1108" y="596" font-size="13" font-weight="400" fill="#666">현재 제거 가능 / R2의 남은 수</text><text x="1108" y="621" font-size="14" font-weight="400" fill="#333">목표 예시: G 제거로 3개 이상 개방</text><text x="1108" y="644" font-size="13" font-weight="400" fill="#555">검증 경로: G 제거 후 R2는 3 / 3개</text><text x="1098" y="699" font-size="14" font-weight="400" fill="#555">현재 값·목표·검증 결과를 구분합니다</text><rect x="232" y="742" width="830" height="280" rx="5" fill="#fff" stroke="#ccc"/><text x="252" y="779" font-size="20" font-weight="600" fill="#333">저장한 후보와 버전 이력</text><rect x="252" y="800" width="238" height="109" rx="5" fill="#e8e8e8" stroke="#555"/><text x="270" y="834" font-size="16" font-weight="600" fill="#333">후보 A · v1 (표시 예시)</text><text x="270" y="868" font-size="13" font-weight="400" fill="#555">현재 작업 방향</text><text x="270" y="892" font-size="13" font-weight="400" fill="#555">저장하면 같은 후보에 이력 누적</text><rect x="508" y="800" width="244" height="109" rx="5" fill="#fff" stroke="#ccc"/><text x="526" y="834" font-size="16" font-weight="600" fill="#333">새 후보로 저장</text><text x="526" y="868" font-size="13" font-weight="400" fill="#555">다른 방향으로 명시적 분기</text><text x="526" y="892" font-size="13" font-weight="400" fill="#555">생성만으로 후보가 늘지 않음</text><rect x="770" y="800" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="782" y="824" font-size="15" font-weight="400" fill="#333">다른 후보 / 버전과 비교…</text><rect x="770" y="849" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="782" y="873" font-size="15" font-weight="400" fill="#333">이전 저장 버전 보기…</text><text x="252" y="955" font-size="15" font-weight="400" fill="#555">보드와 맵 조건을 함께 보존 · 분석 결과는 해당 버전과 연결</text><text x="252" y="983" font-size="15" font-weight="400" fill="#555">이번 생성량(영역·개수·점유율)은 ‘부분 생성’에서 별도 지정</text><rect x="1078" y="742" width="506" height="280" rx="5" fill="#fff" stroke="#ccc"/><text x="1098" y="780" font-size="20" font-weight="600" fill="#333">선택 화살표 G · 영역 관문</text><text x="1098" y="818" font-size="15" font-weight="400" fill="#555">현재: H가 막고 있어 제거 불가</text><text x="1098" y="847" font-size="15" font-weight="400" fill="#555">역할: R1에 배치하여 R2에 영향</text><text x="1098" y="876" font-size="15" font-weight="400" fill="#555">원본 연결: Z → H → G → A·B·C</text><text x="1098" y="905" font-size="15" font-weight="400" fill="#555">Z·H·G 제거 후 R2에서 3개 개방 확인</text><text x="1098" y="961" font-size="14" font-weight="400" fill="#666">분석에서 관문 전후를 비교할 수 있습니다.</text><g role="button" tabindex="0" data-screen="analysis" style="cursor:pointer"><rect x="1098" y="976" width="466" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1110" y="1000" font-size="15" font-weight="400" fill="#333">관문 전후 분석 보기 →</text></g></g></svg>
