<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>맵 조건 — 세 요소를 같은 틀로 관리</title><desc>v0.7 기획 목업. 입력과 생성은 미구현이며 보드 수치는 공용 Godot 코어로 검증한 작은 예시에 근거합니다.</desc><g font-family="'Noto Sans CJK KR',sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#f2f2f2" stroke="none"/><text x="22" y="26" font-size="14" font-weight="400" fill="#666">와이어프레임 v0.7 · 화면 배치 제안 · 입력/생성/저장 기능 미구현</text><rect x="0" y="42" width="1600" height="74" rx="0" fill="#fff" stroke="#bbb"/><text x="24" y="87" font-size="23" font-weight="600" fill="#333">Arrow Stage Editor</text><text x="320" y="85" font-size="17" font-weight="400" fill="#333">예시 맵 · 후보 A / v1 (후보·버전 표시는 모형)</text><rect x="1210" y="60" width="140" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1222" y="84" font-size="15" font-weight="400" fill="#333">저장</text><rect x="1368" y="60" width="208" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1380" y="84" font-size="15" font-weight="400" fill="#333">새 후보로 저장</text><rect x="16" y="134" width="198" height="906" rx="5" fill="#fff" stroke="#ccc"/><text x="34" y="166" font-size="19" font-weight="600" fill="#333">작업 공간</text><rect x="30" y="190" width="170" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="214" font-size="15" font-weight="400" fill="#333">맵 열기</text><rect x="30" y="252" width="170" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="276" font-size="15" font-weight="400" fill="#333">1  작업</text><rect x="30" y="302" width="170" height="36" rx="5" fill="#333" stroke="#333"/><text x="42" y="326" font-size="15" font-weight="600" fill="white">2  맵 조건</text><rect x="30" y="352" width="170" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="376" font-size="15" font-weight="400" fill="#333">3  분석</text><text x="34" y="436" font-size="16" font-weight="600" fill="#333">기존 기능 유지</text><text x="34" y="472" font-size="15" font-weight="400" fill="#555">부분·영역 생성</text><text x="34" y="504" font-size="15" font-weight="400" fill="#555">직접 화살표 배치</text><text x="34" y="536" font-size="15" font-weight="400" fill="#555">다른 맵 비교·복제</text><text x="34" y="568" font-size="15" font-weight="400" fill="#555">같은 후보에 저장</text><text x="34" y="600" font-size="15" font-weight="400" fill="#555">새 후보로 분기</text><text x="34" y="850" font-size="15" font-weight="600" fill="#333">이번에 구체화할 것</text><text x="34" y="884" font-size="14" font-weight="400" fill="#555">설정의 단위와 의미</text><text x="34" y="912" font-size="14" font-weight="400" fill="#555">빈도·커버리지 기준</text><text x="34" y="940" font-size="14" font-weight="400" fill="#555">필수 / 권장 조건</text><text x="24" y="1072" font-size="14" font-weight="400" fill="#666">현재 2단계 기획 · 3단계 앱 연결 / 4단계 코어 확장 / 5단계 실제 편집·저장</text><rect x="232" y="134" width="1352" height="348" rx="5" fill="#fff" stroke="#ccc"/><text x="254" y="172" font-size="23" font-weight="600" fill="#333">맵 조건 · 통합 점수 없이 요소별로 관리</text><text x="254" y="204" font-size="16" font-weight="400" fill="#333">맵에 저장할 제작 기준입니다. 현재 보드의 측정값이나 이번 생성량과 다릅니다.</text><rect x="254" y="226" width="1308" height="43" rx="0" fill="#e8e8e8" stroke="#ccc"/><text x="272" y="254" font-size="16" font-weight="600" fill="#333">요소</text><text x="480" y="254" font-size="16" font-weight="600" fill="#333">목표 수준</text><text x="756" y="254" font-size="16" font-weight="600" fill="#333">등장 빈도</text><text x="1020" y="254" font-size="16" font-weight="600" fill="#333">범위·커버리지</text><text x="1338" y="254" font-size="16" font-weight="600" fill="#333">설정 출처</text><rect x="254" y="270" width="1308" height="60" rx="0" fill="#fff" stroke="#ddd"/><text x="272" y="306" font-size="17" font-weight="600" fill="#333">풀이 가능 수</text><text x="480" y="306" font-size="15" font-weight="400" fill="#333">목표: 1~2개 (입력 예시)</text><text x="756" y="306" font-size="15" font-weight="400" fill="#333">간격: 미설정</text><text x="1020" y="306" font-size="14" font-weight="400" fill="#333">대상·적용량 미설정</text><text x="1338" y="306" font-size="14" font-weight="400" fill="#333">직접 지정</text><rect x="254" y="330" width="1308" height="60" rx="0" fill="#fff" stroke="#ddd"/><text x="272" y="366" font-size="17" font-weight="600" fill="#333">연쇄</text><text x="480" y="366" font-size="15" font-weight="400" fill="#333">선행 관계 깊이: 미설정</text><text x="756" y="366" font-size="15" font-weight="400" fill="#333">압박 반복: 미설정</text><text x="1020" y="366" font-size="14" font-weight="400" fill="#333">대상·적용량 미설정</text><text x="1338" y="366" font-size="14" font-weight="400" fill="#333">직접 / 자동</text><rect x="254" y="390" width="1308" height="60" rx="0" fill="#e9e9e9" stroke="#ddd"/><text x="272" y="426" font-size="17" font-weight="600" fill="#333">영역 개방</text><text x="480" y="426" font-size="15" font-weight="400" fill="#333">새로 열림: 3개 이상 (예시)</text><text x="756" y="426" font-size="15" font-weight="400" fill="#333">반복: 미설정</text><text x="1020" y="426" font-size="14" font-weight="400" fill="#333">대상 R2 / 적용량 미설정</text><text x="1338" y="426" font-size="14" font-weight="400" fill="#333">직접 지정</text><rect x="232" y="500" width="832" height="522" rx="5" fill="#fff" stroke="#ccc"/><text x="254" y="539" font-size="21" font-weight="600" fill="#333">선택한 요소만 상세 편집 · 영역 개방</text><text x="254" y="584" font-size="16" font-weight="600" fill="#333">목표 수준</text><rect x="416" y="560" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="428" y="584" font-size="15" font-weight="400" fill="#333">새로 제거 가능해지는 수 ▾</text><rect x="700" y="560" width="336" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="712" y="584" font-size="15" font-weight="400" fill="#333">3개 이상 (설명용 입력)</text><text x="254" y="642" font-size="16" font-weight="600" fill="#333">등장 빈도</text><rect x="416" y="618" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="428" y="642" font-size="15" font-weight="400" fill="#333">간격 지정 / 발생 확률 ▾</text><rect x="700" y="618" width="336" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="712" y="642" font-size="15" font-weight="400" fill="#333">값·기준 단위 미설정</text><text x="254" y="700" font-size="16" font-weight="600" fill="#333">적용 범위</text><rect x="416" y="676" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="428" y="700" font-size="15" font-weight="400" fill="#333">영향 영역: R2 ▾</text><rect x="700" y="676" width="336" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="712" y="700" font-size="15" font-weight="400" fill="#333">풀이 적용 구간: 미설정</text><text x="254" y="758" font-size="16" font-weight="600" fill="#333">커버리지</text><rect x="416" y="734" width="620" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="428" y="758" font-size="15" font-weight="400" fill="#333">적용할 양 / 비율 / 집계 단위: 후속 정의</text><text x="254" y="816" font-size="16" font-weight="600" fill="#333">설정 출처</text><rect x="416" y="792" width="270" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="428" y="816" font-size="15" font-weight="400" fill="#333">직접 지정 ▾</text><rect x="700" y="792" width="336" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="712" y="816" font-size="15" font-weight="400" fill="#333">스테이지별 자동 조정…</text><text x="254" y="876" font-size="15" font-weight="400" fill="#555">새 요소도 같은 설정 틀에 추가하되, 계산 방식은 요소별로 정의합니다.</text><text x="254" y="906" font-size="15" font-weight="400" fill="#555">빈도와 강도는 별개이며 발생 확률이 일정 간격을 보장하지는 않습니다.</text><text x="254" y="936" font-size="15" font-weight="400" fill="#555">선행 관계의 깊이와 압박 구간의 반복 횟수도 구분합니다.</text><rect x="1080" y="500" width="504" height="522" rx="5" fill="#fff" stroke="#ccc"/><text x="1102" y="539" font-size="20" font-weight="600" fill="#333">확인할 정의는 여기로 모읍니다</text><text x="1102" y="585" font-size="16" font-weight="600" fill="#333">아직 확정하지 않은 부분</text><text x="1102" y="621" font-size="15" font-weight="400" fill="#555">• 반복 사건의 시작·끝 기준</text><text x="1102" y="652" font-size="15" font-weight="400" fill="#555">• 간격의 기준: 진행률 / 제거 수 등</text><text x="1102" y="683" font-size="15" font-weight="400" fill="#555">• 커버리지 단위와 분모·중복 처리</text><text x="1102" y="714" font-size="15" font-weight="400" fill="#555">• 자동 조정의 계산식과 상하한</text><text x="1102" y="745" font-size="15" font-weight="400" fill="#555">• 필수 조건 / 권장 목표의 구분</text><text x="1102" y="820" font-size="16" font-weight="600" fill="#333">입력 예시는 구현 완료가 아닙니다</text><text x="1102" y="856" font-size="15" font-weight="400" fill="#555">맵을 생성하거나 목표를 검증하는 기능은</text><text x="1102" y="885" font-size="15" font-weight="400" fill="#555">아직 연결하지 않았습니다. 빈도·커버리지는</text><text x="1102" y="914" font-size="15" font-weight="400" fill="#555">합의 전 임의로 계산하지 않습니다.</text><rect x="1102" y="961" width="456" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1114" y="985" font-size="15" font-weight="400" fill="#333">분석에서 목표와 결과 비교 →</text></g></svg>
