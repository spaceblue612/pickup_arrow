<script>
const panels={work:document.getElementById('work-panel'),analysis:document.getElementById('analysis-panel')},profileDialog=document.getElementById('profile-dialog');
function showScreen(key){if(!panels[key])return;Object.entries(panels).forEach(([name,p])=>p.hidden=name!==key);document.querySelectorAll('button[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===key)));}
function activate(target){const control=target.closest('[data-screen],[data-open-profile]');if(!control)return;if(control.hasAttribute('data-open-profile')){if(!profileDialog.open)profileDialog.showModal();}else{showScreen(control.dataset.screen);}}
document.addEventListener('click',e=>activate(e.target));
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('g[role=button]')){e.preventDefault();activate(e.target);}});
document.getElementById('close-profile').addEventListener('click',()=>profileDialog.close());
const query=new URLSearchParams(location.search);showScreen(query.get('screen')||'work');if(query.get('modal')==='1')profileDialog.showModal();
</script></html>
