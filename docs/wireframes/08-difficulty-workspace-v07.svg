<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>작업 화면 — 현재 상태와 저장할 조건을 분리</title><desc>v0.7 기획 목업. 입력과 생성은 미구현이며 보드 수치는 공용 Godot 코어로 검증한 작은 예시에 근거합니다.</desc><g font-family="'Noto Sans CJK KR',sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#f2f2f2" stroke="none"/><text x="22" y="26" font-size="14" font-weight="400" fill="#666">와이어프레임 v0.7 · 화면 배치 제안 · 입력/생성/저장 기능 미구현</text><rect x="0" y="42" width="1600" height="74" rx="0" fill="#fff" stroke="#bbb"/><text x="24" y="87" font-size="23" font-weight="600" fill="#333">Arrow Stage Editor</text><text x="320" y="85" font-size="17" font-weight="400" fill="#333">예시 맵 · 후보 A / v1 (후보·버전 표시는 모형)</text><rect x="1210" y="60" width="140" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1222" y="84" font-size="15" font-weight="400" fill="#333">저장</text><rect x="1368" y="60" width="208" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1380" y="84" font-size="15" font-weight="400" fill="#333">새 후보로 저장</text><rect x="16" y="134" width="198" height="906" rx="5" fill="#fff" stroke="#ccc"/><text x="34" y="166" font-size="19" font-weight="600" fill="#333">작업 공간</text><rect x="30" y="190" width="170" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="214" font-size="15" font-weight="400" fill="#333">맵 열기</text><rect x="30" y="252" width="170" height="36" rx="5" fill="#333" stroke="#333"/><text x="42" y="276" font-size="15" font-weight="600" fill="white">1  작업</text><rect x="30" y="302" width="170" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="326" font-size="15" font-weight="400" fill="#333">2  맵 조건</text><rect x="30" y="352" width="170" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="42" y="376" font-size="15" font-weight="400" fill="#333">3  분석</text><text x="34" y="436" font-size="16" font-weight="600" fill="#333">기존 기능 유지</text><text x="34" y="472" font-size="15" font-weight="400" fill="#555">부분·영역 생성</text><text x="34" y="504" font-size="15" font-weight="400" fill="#555">직접 화살표 배치</text><text x="34" y="536" font-size="15" font-weight="400" fill="#555">다른 맵 비교·복제</text><text x="34" y="568" font-size="15" font-weight="400" fill="#555">같은 후보에 저장</text><text x="34" y="600" font-size="15" font-weight="400" fill="#555">새 후보로 분기</text><text x="34" y="850" font-size="15" font-weight="600" fill="#333">이번에 구체화할 것</text><text x="34" y="884" font-size="14" font-weight="400" fill="#555">설정의 단위와 의미</text><text x="34" y="912" font-size="14" font-weight="400" fill="#555">빈도·커버리지 기준</text><text x="34" y="940" font-size="14" font-weight="400" fill="#555">필수 / 권장 조건</text><text x="24" y="1072" font-size="14" font-weight="400" fill="#666">현재 2단계 기획 · 3단계 앱 연결 / 4단계 코어 확장 / 5단계 실제 편집·저장</text><rect x="232" y="134" width="968" height="596" rx="5" fill="#fff" stroke="#ccc"/><text x="252" y="169" font-size="21" font-weight="600" fill="#333">작업 · 보드에 집중하고 상세 조건은 별도 화면에서</text><rect x="252" y="189" width="122" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="264" y="213" font-size="15" font-weight="400" fill="#333">선택</text><rect x="386" y="189" width="130" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="398" y="213" font-size="15" font-weight="400" fill="#333">화살표 배치</text><rect x="528" y="189" width="132" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="540" y="213" font-size="15" font-weight="400" fill="#333">영역 편집</text><rect x="672" y="189" width="150" height="36" rx="5" fill="#333" stroke="#333"/><text x="684" y="213" font-size="15" font-weight="600" fill="white">역할·연결 보기</text><rect x="834" y="189" width="148" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="846" y="213" font-size="15" font-weight="400" fill="#333">부분 생성…</text><g transform="translate(290,245) scale(1.04)"><rect x="60" y="45" width="504" height="378" rx="0" fill="#fafafa" stroke="#ddd"/><path d="M102 45v378" stroke="#e8e8e8"/><path d="M144 45v378" stroke="#e8e8e8"/><path d="M186 45v378" stroke="#e8e8e8"/><path d="M228 45v378" stroke="#e8e8e8"/><path d="M270 45v378" stroke="#e8e8e8"/><path d="M312 45v378" stroke="#e8e8e8"/><path d="M354 45v378" stroke="#e8e8e8"/><path d="M396 45v378" stroke="#e8e8e8"/><path d="M438 45v378" stroke="#e8e8e8"/><path d="M480 45v378" stroke="#e8e8e8"/><path d="M522 45v378" stroke="#e8e8e8"/><path d="M60 87h504" stroke="#e8e8e8"/><path d="M60 129h504" stroke="#e8e8e8"/><path d="M60 171h504" stroke="#e8e8e8"/><path d="M60 213h504" stroke="#e8e8e8"/><path d="M60 255h504" stroke="#e8e8e8"/><path d="M60 297h504" stroke="#e8e8e8"/><path d="M60 339h504" stroke="#e8e8e8"/><path d="M60 381h504" stroke="#e8e8e8"/><rect x="60" y="45" width="420" height="126" rx="0" fill="#ececec" stroke="#777"/><text x="295" y="70" font-size="15" font-weight="600" fill="#333">R1 · 선행 구간</text><rect x="144" y="171" width="294" height="210" rx="0" fill="#f4f4f4" stroke="#888"/><text x="152" y="371" font-size="15" font-weight="600" fill="#333">R2 · 개방 대상</text><g opacity="1"><path d="M95 66L75 66" stroke="#222" stroke-width="6" stroke-linecap="round"/><path d="M67 66L86 56L86 76Z" fill="#222"/><text x="96" y="52" font-size="14" font-weight="600" fill="#222">Z</text></g><g opacity="1"><path d="M81 164L81 144" stroke="#777" stroke-width="6" stroke-linecap="round"/><path d="M81 136L91 155L71 155Z" fill="#777"/><text x="96" y="136" font-size="14" font-weight="600" fill="#777">H</text></g><g opacity="1"><polyline points="459,150 417,150 375,150 333,150 291,150 249,150 207,150 165,150 123,150" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M109 150L128 140L128 160Z" fill="#777"/><text x="138" y="136" font-size="14" font-weight="600" fill="#777">G · 관문</text><text x="280" y="180" font-size="13" font-weight="400" fill="#555">A·B·C의 위쪽 탈출 경로를 차단</text></g><g opacity="1"><polyline points="207,276 207,234" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M207 220L217 239L197 239Z" fill="#777"/><text x="222" y="220" font-size="14" font-weight="600" fill="#777">A</text></g><g opacity="1"><polyline points="291,276 291,234" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M291 220L301 239L281 239Z" fill="#777"/><text x="306" y="220" font-size="14" font-weight="600" fill="#777">B</text></g><g opacity="1"><polyline points="375,276 375,234" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M375 220L385 239L365 239Z" fill="#777"/><text x="390" y="220" font-size="14" font-weight="600" fill="#777">C</text></g><path d="M207 212V162" stroke="#888" stroke-dasharray="4 5" fill="none"/><path d="M291 212V162" stroke="#888" stroke-dasharray="4 5" fill="none"/><path d="M375 212V162" stroke="#888" stroke-dasharray="4 5" fill="none"/><text x="60" y="455" font-size="14" font-weight="400" fill="#666">진한 화살: 제거 가능 / 회색: 막힘</text></g><text x="948" y="285" font-size="17" font-weight="600" fill="#333">현재 상태</text><text x="948" y="322" font-size="16" font-weight="400" fill="#555">전체 6개</text><text x="948" y="354" font-size="16" font-weight="400" fill="#555">제거 가능 1개</text><text x="948" y="386" font-size="16" font-weight="400" fill="#555">막힘 5개</text><text x="948" y="460" font-size="16" font-weight="600" fill="#333">선택 영역 R2</text><text x="948" y="496" font-size="15" font-weight="400" fill="#555">남은 수 3개</text><text x="948" y="526" font-size="15" font-weight="400" fill="#555">제거 가능 0개</text><text x="948" y="556" font-size="15" font-weight="400" fill="#555">막힘 100%</text><rect x="1216" y="134" width="368" height="596" rx="5" fill="#fff" stroke="#ccc"/><text x="1236" y="170" font-size="21" font-weight="600" fill="#333">선택 화살표 G</text><text x="1236" y="209" font-size="16" font-weight="600" fill="#333">현재 상태</text><text x="1236" y="243" font-size="15" font-weight="400" fill="#555">지금 제거 불가 · H가 차단</text><text x="1236" y="273" font-size="15" font-weight="400" fill="#555">선행 관계: Z → H → G</text><text x="1236" y="341" font-size="17" font-weight="600" fill="#333">맵에 보존할 역할</text><text x="1236" y="376" font-size="15" font-weight="400" fill="#555">역할: 영역 관문 (설계 의도)</text><text x="1236" y="407" font-size="15" font-weight="400" fill="#555">배치 영역: R1 / 영향 영역: R2</text><text x="1236" y="438" font-size="15" font-weight="400" fill="#555">연결은 제거 후에도 원본에 보존</text><text x="1236" y="514" font-size="16" font-weight="600" fill="#333">풀이 흐름에서 확인된 효과</text><text x="1236" y="549" font-size="14" font-weight="400" fill="#555">Z·H 제거 후 G 제거 가능</text><text x="1236" y="578" font-size="14" font-weight="400" fill="#555">G 제거 후 R2: 0 → 3개 개방</text><text x="1236" y="607" font-size="14" font-weight="400" fill="#555">관문 하나의 예시 / 반복은 미검증</text><rect x="1236" y="666" width="322" height="36" rx="5" fill="#fff" stroke="#aaa"/><text x="1248" y="690" font-size="15" font-weight="400" fill="#333">분석에서 전후 비교 →</text><rect x="232" y="748" width="968" height="274" rx="5" fill="#fff" stroke="#ccc"/><text x="252" y="782" font-size="19" font-weight="600" fill="#333">저장한 후보 · 같은 방향은 버전 이력으로 누적</text><rect x="252" y="806" width="240" height="108" rx="5" fill="#e8e8e8" stroke="#555"/><text x="270" y="838" font-size="16" font-weight="600" fill="#333">후보 A · v1 (표시 예시)</text><text x="270" y="869" font-size="14" font-weight="400" fill="#555">현재 보드의 작업 방향</text><text x="270" y="894" font-size="14" font-weight="400" fill="#555">저장 → A의 다음 버전</text><rect x="510" y="806" width="244" height="108" rx="5" fill="#fff" stroke="#ccc"/><text x="528" y="838" font-size="16" font-weight="600" fill="#333">새 후보로 저장</text><text x="528" y="869" font-size="14" font-weight="400" fill="#555">다른 방향으로 명시적 분기</text><text x="528" y="894" font-size="14" font-weight="400" fill="#555">생성할 때마다 자동 추가 안 함</text><text x="252" y="960" font-size="16" font-weight="400" fill="#333">맵 조건 요약: 풀이 가능 수 / 연쇄 / 영역 개방 · 상세 입력은 ‘맵 조건’에서</text><rect x="1216" y="748" width="368" height="274" rx="5" fill="#fff" stroke="#ccc"/><text x="1236" y="782" font-size="18" font-weight="600" fill="#333">이번 생성과 맵 조건은 구분</text><text x="1236" y="820" font-size="15" font-weight="400" fill="#555">이번 생성: 영역·개수·점유율</text><text x="1236" y="850" font-size="15" font-weight="400" fill="#555">맵 조건: 목표·빈도·커버리지</text><text x="1236" y="880" font-size="15" font-weight="400" fill="#555">분석 결과: 버전·풀이 경로별 확인</text><text x="1236" y="910" font-size="15" font-weight="400" fill="#555">목표 미달과 계산 미완료를 구분</text><text x="1236" y="983" font-size="13" font-weight="400" fill="#666">보드 수치는 검증 예시 / 저장 UI는 모형</text></g></svg>
